<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" preserveAspectRatio="none">
  <defs>
    <g id="page-corner"
       fill="none"
       stroke="#c8a264"
       stroke-width="1.45"
       stroke-linecap="round"
       stroke-linejoin="round">

      <!-- short corner cap lines -->
      <path d="M18 18 h8"/>
      <path d="M24 24 h8"/>

      <!-- inset quarter-curve -->
      <path d="M24 41
               C34 41 41 34 41 24"/>

      <!-- small inner box / return -->
      <path d="M25 35 h9 v-11"/>
    </g>
  </defs>

  <!-- outer rim, with a centre gap at the bottom for the ornament -->
  <path d="M24 917 V24 H1648 V917 H900 M772 917 H24"
        fill="none"
        stroke="#c8a264"
        stroke-width="1.45"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- inner rim, with a centre gap at the bottom for the ornament -->
  <path d="M30 911 V30 H1642 V911 H894 M778 911 H30"
        fill="none"
        stroke="#c8a264"
        stroke-width="1.45"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- top-left -->
  <g transform="translate(6 6)">
    <use href="#page-corner"/>
  </g>

  <!-- top-right -->
  <g transform="translate(1666 6) scale(-1 1)">
    <use href="#page-corner"/>
  </g>

  <!-- bottom-left -->
  <g transform="translate(6 935) scale(1 -1)">
    <use href="#page-corner"/>
  </g>

  <!-- bottom-right -->
  <g transform="translate(1666 935) scale(-1 -1)">
    <use href="#page-corner"/>
  </g>
</svg>
